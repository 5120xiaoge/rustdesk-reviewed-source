networks:
  rustdesk-net:
    external: false

services:
  rustdesk:
    image: ghcr.io/5120xiaoge/rustdesk-server-s6-reviewed:reviewed-20261111-v1.2
    ports:
      - "21114:21114"
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21117:21117"
      - "21118:21118"
      - "21119:21119"
    environment:
      - RELAY=117.24.15.98:21117
      - ENCRYPTED_ONLY=1
      - MUST_LOGIN=Y
      - TZ=Asia/Shanghai
      - RUSTDESK_API_RUSTDESK_ID_SERVER=117.24.15.98:21116
      - RUSTDESK_API_RUSTDESK_RELAY_SERVER=117.24.15.98:21117
      - RUSTDESK_API_RUSTDESK_API_SERVER=http://117.24.15.98:21114
      - RUSTDESK_API_RUSTDESK_KEY_FILE=/data/id_ed25519.pub
    volumes:
      - /data/rustdesk/server:/data
      - /data/rustdesk/api:/app/data
    networks:
      - rustdesk-net
    restart: unless-stopped

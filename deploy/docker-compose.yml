networks:
  rustdesk-net:
    external: false

services:
  rustdesk:
    image: ghcr.io/5120xiaoge/rustdesk-server-s6-reviewed:reviewed-20261111-v1.1
    platform: linux/amd64
    ports:
      - "127.0.0.1:21114:21114"
      - "22115:21115"
      - "22116:21116"
      - "22116:21116/udp"
      - "22117:21117"
      - "22118:21118"
      - "22119:21119"
    environment:
      RELAY: rust.520kx.dpdns.org:22117
      ENCRYPTED_ONLY: "1"
      MUST_LOGIN: "Y"
      TZ: Asia/Shanghai
      RUSTDESK_API_RUSTDESK_ID_SERVER: rust.520kx.dpdns.org:22116
      RUSTDESK_API_RUSTDESK_RELAY_SERVER: rust.520kx.dpdns.org:22117
      RUSTDESK_API_RUSTDESK_API_SERVER: https://rust.520kx.dpdns.org
      RUSTDESK_API_RUSTDESK_KEY_FILE: /data/id_ed25519.pub
      RUSTDESK_API_JWT_KEY: ${RUSTDESK_API_JWT_KEY:?Set a new private JWT key in the shell}
    volumes:
      - type: bind
        source: /data/rustdesk/server
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /data/rustdesk/api
        target: /app/data
        bind:
          create_host_path: false
    networks:
      - rustdesk-net
    restart: unless-stopped

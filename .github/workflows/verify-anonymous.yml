name: Verify anonymous reviewed Docker deployment

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Validate Compose only, or also test anonymous image deployment
        type: choice
        required: true
        default: anonymous
        options:
          - compose
          - anonymous

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/5120xiaoge/rustdesk-server-s6-reviewed@sha256:bfa791c8cb6662ce157ca4c583df101bdcc44a5d97106d6bd1b3d259b8cf1aae
      RUSTDESK_PUBLIC_HOST: rustdesk.example.test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Validate Compose requirements and schema-only database
        shell: bash
        run: |
          set -eu
          if env -u RUSTDESK_PUBLIC_HOST docker compose -f deploy/docker-compose.yml config --quiet 2>/dev/null; then
            echo 'Compose must reject a missing RUSTDESK_PUBLIC_HOST' >&2
            exit 1
          fi
          if RUSTDESK_PUBLIC_HOST='' docker compose -f deploy/docker-compose.yml config --quiet 2>/dev/null; then
            echo 'Compose must reject an empty RUSTDESK_PUBLIC_HOST' >&2
            exit 1
          fi
          docker compose -f deploy/docker-compose.yml config --quiet
          python3 - <<'PY'
          import sqlite3

          db = sqlite3.connect("file:server/db_v2.sqlite3?mode=ro", uri=True)
          assert db.execute("PRAGMA integrity_check").fetchall() == [("ok",)]
          assert db.execute("SELECT name FROM sqlite_master WHERE type = 'table'").fetchall() == [("peer",)]
          assert db.execute("SELECT count(*) FROM peer").fetchone()[0] == 0
          db.close()
          PY
      - name: Pull with an empty Docker credential directory
        if: inputs.scope == 'anonymous'
        shell: bash
        run: |
          set -eu
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          mkdir -p "$DOCKER_CONFIG"
          test ! -e "$DOCKER_CONFIG/config.json"
          docker pull --platform linux/amd64 "$IMAGE"
          test "$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$IMAGE")" = linux/amd64
      - name: Test anonymous original-style Compose first installation and restart
        if: inputs.scope == 'anonymous'
        shell: bash
        run: |
          set -eu
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          test ! -e /data/rustdesk
          trap 'docker compose -p reviewed-anonymous -f deploy/docker-compose.yml down >/dev/null 2>&1 || true' EXIT
          docker compose -p reviewed-anonymous -f deploy/docker-compose.yml up -d --wait --wait-timeout 180
          cid="$(docker compose -p reviewed-anonymous -f deploy/docker-compose.yml ps -q rustdesk)"
          test -n "$cid"
          test "$(docker inspect -f '{{.Image}}' "$cid")" = "$(docker image inspect -f '{{.Id}}' "$IMAGE")"
          docker exec "$cid" wget -q -O /dev/null http://127.0.0.1:21114/api/version
          docker exec "$cid" wget -q -O /dev/null http://127.0.0.1:21114/_admin/
          docker exec "$cid" rustdesk-utils validatekeypair-files \
            /data/id_ed25519.pub /data/id_ed25519 >/dev/null
          docker exec "$cid" sh -c 'test "$(stat -c %a /app/data/.bootstrap)" = 700 && test "$(stat -c %a /app/data/.bootstrap/jwt.key)" = 600 && test "$(stat -c %a /app/data/.bootstrap/admin.password)" = 600'
          before="$(docker exec "$cid" sha256sum /data/id_ed25519 /data/id_ed25519.pub /app/data/.bootstrap/jwt.key /app/data/.bootstrap/admin.password)"
          docker restart "$cid" >/dev/null
          ready=false
          for attempt in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy ]; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          after="$(docker exec "$cid" sha256sum /data/id_ed25519 /data/id_ed25519.pub /app/data/.bootstrap/jwt.key /app/data/.bootstrap/admin.password)"
          test "$before" = "$after"
